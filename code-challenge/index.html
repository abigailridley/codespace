<html lang="en">

  <body>
    <div class="container text-center mt-5">
      <h1>Guess the number</h1>
      <p class="font-italic">Guess a number between 1 and 10</p>
      <div class="font-weight-bold text-monospace"  id="guess-count"></div>
      <div class="">
        <input
          id="userGuessInput"
          type="number"
          style="max-width: 200px"
          class="m-2"
        /><button class="btn btn-submit btn-outline-info" id="guess">
          Guess
        </button>
        </div>
       
          <div id="userGuess"></div>
        <div class="mb-2 mt-2" id="result"></div>
      

        <div><button class="btn btn-outline-dark" id="new-game">New Game</button></div>
      </div>
    </div>
  </body>
