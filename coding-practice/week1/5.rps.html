    <h1>Rock Paper Scissors</h1>
    <div>
      <button id="rock">Rock</button>
      <button id="paper">Paper</button>
      <button id="scissors">Scissors</button>
    </div>
    <div>
      <div>Your choice: <span id="yourchoice"></span></div>
      <div>Computer choice: <span id="computerchoice"></span></div>
      <div>Result: <span id="result"></span></div>
    </div>

      const computerChoiceSpan = document.getElementById("computerchoice");
      const resultSpan = document.getElementById("result");

      rockBtn.addEventListener("click", () => calcResults(choices[0]));
      paperBtn.addEventListener("click", () => calcResults(choices[1]));
      scissorsBtn.addEventListener("click", () => calcResults(choices[2]));

      const calcResults = (userChoice) => {
        let computerchoice =
          choices[Math.floor(Math.random() * choices.length)];

        yourChoiceSpan.innerText = userChoice;
        computerChoiceSpan.innerText = computerchoice;
        resultSpan.innerText = result;

        if (yourchoice === computerchoice) {
          resultSpan.innerText = "It's a draw!";
        } else if (
          (yourchoice === "rock" && computerchoice === "scissors") ||
          (yourchoice === "paper" && computerchoice === "rock") ||
          (yourchoice === "scissors" && computerchoice === "paper")
        ) {
          resultSpan.innerText = "You win!";
        } else {
          resultSpan.innerText = "You lose!";
        }
      };
